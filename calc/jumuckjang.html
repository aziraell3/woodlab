<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>주먹장 계산기 | 오프라인</title>
<style>
:root{color-scheme:light;--orange:#ea580c;--blue:#2563eb;--green:#16a34a;--red:#dc2626;--purple:#9333ea;--surface:#f5f6f8;--line:#d9dce2;--text:#22242a;--muted:#656b75}
*{box-sizing:border-box}body{margin:0;background:#f1f2f4;font-family:system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:var(--text);line-height:1.5}.app{max-width:720px;margin:24px auto;padding:0 15px 22px}h1{font-size:23px;margin:0 0 16px}.panel{padding:19px;background:white;border:1px solid var(--line);border-radius:14px;margin-bottom:14px}.kicker{font-size:12px;color:var(--muted);font-weight:700;margin-bottom:14px}.options{display:grid;gap:14px}.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:13px}.field{min-width:0;display:grid;gap:5px}.field label{font-size:13px;font-weight:650}.field input[type=number]{width:100%;height:42px;padding:8px 11px;border:2px solid var(--field-color);border-radius:8px;background:transparent;color:var(--text);font:inherit;outline:none;box-shadow:none;appearance:textfield;-moz-appearance:textfield}.field input[type=number]::-webkit-outer-spin-button,.field input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}.field input[type=number]:focus{border-color:var(--field-color);outline:none;box-shadow:none}.orange{--field-color:var(--orange)}.blue{--field-color:var(--blue)}.green{--field-color:var(--green)}.red{--field-color:var(--red)}.purple{--field-color:var(--purple)}.check{display:flex;align-items:center;gap:9px;min-height:38px;font-size:13px;font-weight:550;cursor:pointer}.check input{accent-color:var(--purple);width:17px;height:17px;flex:0 0 auto}.tabs,.toggles{display:flex;gap:5px;background:var(--surface);padding:5px;border-radius:10px}.tabs{margin-bottom:17px}.tabs button,.toggles button{flex:1;font:inherit;border:none;background:transparent;border-radius:7px;padding:10px 7px;cursor:pointer;color:var(--text)}.tabs button[aria-selected=true],.toggles button[aria-pressed=true]{background:white;box-shadow:0 1px 4px #0002;font-weight:700}.subtitle{font-weight:700;margin:0 0 15px}.muted{color:var(--muted);font-size:12px}.hidden{display:none!important}.metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.metric{padding:15px;background:var(--surface);border-radius:10px;border-bottom:3px solid var(--blue)}.metric small{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}.metric strong{display:block;color:var(--blue);font-size:23px;overflow-wrap:anywhere}.detail{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 1px;border-bottom:1px solid var(--line);font-size:13px}.detail strong{white-space:nowrap}.drawing-title{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:20px 0 10px}.drawing-title strong{font-size:15px}.toggles{margin-bottom:10px}.figure{padding:11px;background:var(--surface);border-radius:11px;overflow:hidden}svg{display:block;width:100%;height:auto}.legend{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin-top:8px}.legend span{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted)}.swatch{display:inline-block;width:13px;height:5px;border-radius:2px}.error{color:var(--red);font-size:13px;padding:13px}.footer{display:flex;justify-content:flex-end;margin-top:15px}.reset{background:white;border:1px solid var(--line);padding:9px 14px;border-radius:9px;font:inherit;cursor:pointer}.note{margin-top:10px;font-size:12px;color:var(--muted)}@media(max-width:480px){.app{margin:10px auto;padding:0 9px 12px}.panel{padding:14px}.field label{font-size:12px}.metric strong{font-size:19px}.check{font-size:12px}}
.check.unavailable{opacity:.48;cursor:not-allowed}
/* 기울기 수치 및 두 옵션은 모든 뷰포트에서 한 행으로 표시 */
.slope-row{display:grid;grid-template-columns:minmax(85px,1fr) max-content max-content;gap:12px;align-items:end;min-width:0}
.slope-row .slope-check{min-height:42px;gap:5px;white-space:nowrap;font-size:12px}
.slope-row .slope-check input{width:15px;height:15px}
@media(max-width:480px){.slope-row{grid-template-columns:minmax(70px,1fr) max-content max-content;gap:7px}.slope-row .slope-check{font-size:11px;gap:4px}.slope-row .slope-check input{width:14px;height:14px}}
/* 데스크톱: 입력과 작도를 동시에 확인할 수 있는 2단 레이아웃 */
.workspace{display:block}
@media(min-width:768px){
 .app{max-width:1360px;margin:24px auto;padding:0 22px 26px}
 .workspace{display:grid;grid-template-columns:minmax(320px,0.85fr) minmax(0,1.15fr);gap:18px;align-items:start}
 .workspace-inputs{min-width:0}
 .workspace-preview{position:sticky;top:16px;min-width:0;max-height:calc(100vh - 32px);overflow:auto;scrollbar-gutter:stable}
 /* 우측은 작도부터 표시하고, 계산값은 그 아래 배치 */
 .workspace-preview{display:flex;flex-direction:column}
 .workspace-preview .drawing-title{order:0;margin:0 0 10px}
 .workspace-preview .toggles{order:1}
 .workspace-preview .figure{order:2}
 .workspace-preview>.kicker{order:3;margin:20px 0 8px}
 .workspace-preview>#result{order:4}
 .workspace-preview>.footer{order:5}
 .workspace-preview #drawing{max-width:100%}
}
@media(min-width:768px) and (max-width:960px){
 .app{padding-left:13px;padding-right:13px}
 .workspace{grid-template-columns:minmax(300px,1fr) minmax(0,1fr);gap:12px}
 .panel{padding:14px}
 .field label{font-size:12px}
 .metric strong{font-size:19px}
}
</style>
</head>
<body>
<main class="app">
<h1>주먹장 계산기</h1>
<div class="workspace">
<div class="workspace-inputs">
<section class="panel" aria-label="공통 입력값">
<div class="kicker">공통 입력값</div>
<div class="options">
<div class="field orange"><label for="width">부재의 가로 (mm)</label><input id="width" type="number" value="132" step="any"></div>
<div class="field orange"><label for="thick">부재의 두께 (mm)</label><input id="thick" type="number" value="20" step="any"></div>
<div class="slope-row"><div class="field purple"><label for="angle">기울기 (°)</label><input id="angle" type="number" value="7" step="any"></div><label class="check slope-check"><input type="checkbox" id="reverse">방향반전</label><label class="check slope-check" id="edge-slope-wrap"><input type="checkbox" id="edge-slope">좌/우 기울기 적용</label></div>
</div>
</section>
<section class="panel" aria-label="유형별 입력값">
<div class="tabs" role="tablist" aria-label="유형 선택"><button type="button" role="tab" data-mode="A" aria-selected="true">A형</button><button type="button" role="tab" data-mode="B" aria-selected="false">B형</button><button type="button" role="tab" data-mode="C" aria-selected="false">C형</button></div>
<div class="subtitle" id="type-title">A형 · 균등 분할</div>
<div id="a-panel" class="options" role="tabpanel">
<div class="grid2"><div class="field blue"><label for="ac">촉의 개수 (개)</label><input type="number" id="ac" value="5" min="1" max="20" step="1"></div><div class="field blue"><label for="aw">촉의 가로 길이 (mm)</label><input type="number" id="aw" value="20" step="any"></div></div>
<label class="check"><input type="checkbox" id="a-ends">좌우 촉 길이 별도 지정</label><div class="field green hidden" id="a-edge-wrap"><label for="a-edge">좌우 촉 각각의 길이 (mm)</label><input type="number" id="a-edge" value="10" step="any"></div>
</div>
<div id="b-panel" class="options hidden" role="tabpanel">
<div class="grid2"><div class="field blue"><label for="bc">촉의 개수 (개)</label><input type="number" id="bc" value="5" min="1" max="20" step="1"></div><div class="field blue"><label for="bt">촉의 길이 (mm)</label><input type="number" id="bt" value="15" step="any"></div></div>
<div class="field green"><label for="b-edge">좌우 촉 길이 (mm)</label><input type="number" id="b-edge" value="10" step="any"></div>
<div class="muted">B형의 촉 길이 입력값은 현재 계산식에 반영되지 않습니다.</div>
</div>
<div id="c-panel" class="options hidden" role="tabpanel">
<div class="grid2"><div class="field blue"><label for="cc">촉의 개수 (개)</label><input type="number" id="cc" value="3" min="2" max="20" step="1"></div><div class="field blue"><label for="ct">촉의 가로 길이 (mm)</label><input type="number" id="ct" value="15" step="any"></div></div>
<div class="muted">촉 사이 간격을 자동 계산하여 가로 방향의 여백을 없앱니다.</div>
</div>

</section>
</div>
<section class="panel workspace-preview" aria-label="계산 결과 및 작도">
<div class="kicker">계산된 값</div><div id="result" aria-live="polite"></div>
<div class="drawing-title"><strong>주먹장 작도 미리보기</strong><span id="drawing-status" class="muted">A형 · 기본 방향</span></div>
<div class="toggles"><button type="button" data-view="each" aria-pressed="true">각 구간 표시</button><button type="button" data-view="cumulative" aria-pressed="false">누적 치수 표시</button></div>
<div class="figure"><svg id="drawing" viewBox="0 0 420 360" role="img" aria-label="주먹장 대각선 길이, 분할점, 제거 영역 작도"></svg><div class="legend"><span><i class="swatch" style="background:#ea580c"></i>부재</span><span><i class="swatch" style="background:#2563eb"></i>대각선</span><span><i class="swatch" style="background:#9333ea"></i>기울기</span><span><i class="swatch" style="background:#16a34a"></i>좌우 촉</span><span><i class="swatch" style="background:#dc2626"></i>제거</span></div></div>
<div class="footer"><button type="button" class="reset" id="reset">전체 초기화</button></div>
</section>
</div>
</main>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id),val=id=>Number($(id).value),checked=id=>$(id).checked;
const fmt=v=>Number.isFinite(v)?Number(v.toFixed(3)).toLocaleString('ko-KR'):'—';
const svgNS='http://www.w3.org/2000/svg';
let mode='A',view='each';
const defaults=Object.fromEntries(Array.from(document.querySelectorAll('input')).map(el=>[el.id,el.type==='checkbox'?el.checked:el.value]));
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){const r=a%b;a=b;b=r}return a||1;}
function compute(){
const m=val('width'),h=val('thick'),angle=val('angle'),n=val(mode==='A'?'ac':mode==='B'?'bc':'cc');
const endsSelected=mode==='B'||mode==='A'&&checked('a-ends');
const edge=endsSelected?val(mode==='A'?'a-edge':'b-edge'):0;
// 0mm is valid: omit zero-width end regions and draw the full center span.
const ends=endsSelected&&edge>0;
if([m,h,angle,n,edge].some(v=>!Number.isFinite(v))||m<=0||h<=0||angle<0||angle>=80||!Number.isInteger(n)||n<1||n>20||edge<0||edge*2>=m)return {error:'부재 치수, 촉 개수 및 좌우 촉 길이를 확인해 주세요.'};
let step=0,total=0,tooth=0,gap=0;
if(mode==='A'){
const aw=val('aw');if(!(aw>0))return {error:'촉의 가로 길이는 0보다 커야 합니다.'};
step=Math.max(Math.floor(m/n)+1,Math.ceil(aw),Math.round(m*1.1/n));total=step*n;
 }else if(mode==='B'){
if(!(val('bt')>0))return {error:'B형 촉 길이를 확인해 주세요.'};
// B형 파란 대각선은 좌우 촉을 제외한 중앙 구간만 계산한다.
const centerWidth=m-2*edge;
step=Math.max(1,Math.floor(centerWidth/n)+1,Math.round(centerWidth*1.1/n));
total=n*step;
}else{
const t=val('ct');if(n<2||!(t>0)||n*t>=m)return {error:'C형은 촉 길이 × 촉 개수가 부재 가로보다 작아야 합니다.'};
const horizontalGap=(m-n*t)/(n-1),x=Math.round(t*1000),y=Math.round(horizontalGap*1000),d=gcd(x,y),u=x/d,v=y/d,base=n*u+(n-1)*v;
if(base<=0||base>10000000)return {error:'정수 분할 범위를 초과했습니다.'};
const multiplier=Math.max(1,Math.floor(m/base)+1);tooth=u*multiplier;gap=v*multiplier;total=base*multiplier;
}
if(!(total>(mode==='B'?m-2*edge:m)&&total<10000000))return {error:'대각선 길이 조건을 확인해 주세요.'};
const segments=[];
if(mode==='C'){
const t=val('ct'),horizontalGap=(m-n*t)/(n-1);
for(let i=0;i<2*n-1;i++)segments.push({w:i%2===0?t:horizontalGap,kind:i%2===0?'keep':'cut'});
}else{
if(ends)segments.push({w:edge,kind:'edge'});
for(let i=0;i<n;i++)segments.push({w:(m-2*edge)/n,kind:(ends||mode==='B')?(i%2===0?'cut':'keep'):(i%2===0?'keep':'cut')});
if(ends)segments.push({w:edge,kind:'edge'});
}
const cumulative=[0];segments.forEach(s=>cumulative.push(cumulative.at(-1)+s.w));
const marks=mode==='A'||mode==='B'?Array.from({length:n+1},(_,i)=>i*step):cumulative.map(v=>v*total/m);
return {m,h,angle,n,ends,edge,step,total,tooth,gap,segments,cumulative,marks};
}
function shape(tag,attrs={},parent=$('drawing'),label){const el=document.createElementNS(svgNS,tag);for(const [k,v] of Object.entries(attrs))el.setAttribute(k,String(v));if(label!==undefined)el.textContent=label;parent.append(el);return el;}
function draw(r){
const svg=$('drawing');svg.replaceChildren();const X=39,W=340,Y=226,H=Math.min(88,W*r.h/r.m),centerWidth=mode==='B'?r.m-2*r.edge:r.m;
const lineX=mode==='B'?X+W*r.edge/r.m:X, lineW=mode==='B'?W*centerWidth/r.m:W;
const rise=Math.min(145,W*Math.sqrt(Math.max(0,r.total*r.total-centerWidth*centerWidth))/r.m),mid=Y+H/2;
const xp=v=>X+W*v/r.m,xd=v=>lineX+lineW*v/r.total;
const tilt=H/2*Math.tan(r.angle*Math.PI/180),sgn=checked('reverse')?-1:1,slopeEnds=checked('edge-slope');
const borders=r.cumulative.map((v,i)=>{
let direction=0;if(i>0&&i<r.cumulative.length-1){if(r.ends&&(i===1||i===r.cumulative.length-2))direction=slopeEnds?(i===1?-1:1):0;else direction=i%2===1?-1:1;}direction*=sgn;
return {x:xp(v),top:xp(v)+tilt*direction,bottom:xp(v)-tilt*direction};
});
svg.setAttribute('viewBox',`0 0 420 ${Math.max(358,Y+H+64)}`);
const defs=shape('defs'),pat=shape('pattern',{id:'joint-hatch',width:8,height:8,patternUnits:'userSpaceOnUse'},defs);
shape('rect',{width:8,height:8,fill:'#fee2e2'},pat);shape('path',{d:'M0 8 L8 0 M0 0 L8 8',stroke:'#dc2626','stroke-width':0.5},pat);
const clip=shape('clipPath',{id:'joint-clip'},defs);shape('rect',{x:X,y:Y,width:W,height:H},clip);
shape('text',{x:210,y:20,'text-anchor':'middle','font-size':13,'font-weight':700,fill:'#2563eb'},svg,`대각선 총길이 ${fmt(r.total)} mm`);
const subtitle=mode==='C'?`촉 ${fmt(r.tooth)}mm × ${r.n} / 간격 ${fmt(r.gap)}mm × ${r.n-1}`:mode==='B'?`${fmt(r.step)}mm × ${r.n}등분 · 좌우 촉 제외`:`${fmt(r.step)}mm × ${r.n}등분`;
shape('text',{x:210,y:39,'text-anchor':'middle','font-size':10,fill:'#2563eb'},svg,subtitle);
shape('rect',{x:X,y:Y,width:W,height:H,fill:'#fb923c','fill-opacity':.13});
const fillGroup=shape('g',{'clip-path':'url(#joint-clip)'});
r.segments.forEach((s,i)=>{if(s.kind!=='cut'&&s.kind!=='edge')return;const a=borders[i],b=borders[i+1];shape('polygon',{points:`${a.top},${Y} ${b.top},${Y} ${b.bottom},${Y+H} ${a.bottom},${Y+H}`,fill:s.kind==='edge'?'#16a34a':'url(#joint-hatch)','fill-opacity':s.kind==='edge'?.43:1},fillGroup);});
borders.slice(1,-1).forEach((p,i)=>{const endEdge=r.ends&&(i===0||i===borders.length-3);shape('line',{x1:p.top,y1:Y,x2:p.bottom,y2:Y+H,stroke:endEdge&&!slopeEnds?'#16a34a':'#9333ea','stroke-width':2.2},fillGroup);});
shape('rect',{x:X,y:Y,width:W,height:H,fill:'none',stroke:'#ea580c','stroke-width':2.4});
shape('line',{x1:X,y1:mid,x2:X+W,y2:mid,stroke:'#64748b','stroke-dasharray':'5 4'});
shape('line',{x1:lineX,y1:Y,x2:lineX+lineW,y2:Y-rise,stroke:'#2563eb','stroke-width':2.6});
r.marks.forEach(v=>{shape('line',{x1:xd(v),y1:Y-rise*v/r.total,x2:xd(v),y2:Y,stroke:'#0d9488','stroke-dasharray':'3 3'});shape('circle',{cx:xd(v),cy:Y-rise*v/r.total,r:2.8,fill:'#2563eb'});});
if(r.marks.length<=17){if(view==='each')r.marks.slice(0,-1).forEach((v,i)=>{const next=r.marks[i+1],z=(v+next)/2;shape('text',{x:xd(z),y:Y-rise*z/r.total-12,fill:'#2563eb','font-size':10,'font-weight':650,'text-anchor':'middle'},svg,fmt(next-v));});else r.marks.slice(1).forEach(v=>shape('text',{x:xd(v),y:Y-rise*v/r.total-12,fill:'#2563eb','font-size':10,'font-weight':650,'text-anchor':'middle'},svg,fmt(v)));}
if(r.segments.length<=13)r.segments.forEach((s,i)=>shape('text',{x:xp((r.cumulative[i]+r.cumulative[i+1])/2),y:mid+4,'font-size':10,'font-weight':700,'text-anchor':'middle',fill:s.kind==='cut'?'#b91c1c':s.kind==='edge'?'#15803d':'#1d4ed8'},svg,i+1));
// B형: 초록색 좌우 촉의 실제 가로 길이는 각 영역 바로 아래에 초록색으로 표시한다.
if(mode==='B'&&r.ends){[r.edge/2,r.m-r.edge/2].forEach(x=>shape('text',{x:xp(x),y:Y+H+15,fill:'#16a34a','font-size':11,'font-weight':700,'text-anchor':'middle'},svg,fmt(r.edge)));}
if(borders.length>2)shape('text',{x:Math.min(406,borders[2].x+9),y:mid-12,fill:'#9333ea','font-size':11,'font-weight':700},svg,`${fmt(r.angle)}°`);
shape('line',{x1:X-12,y1:Y,x2:X-12,y2:Y+H,stroke:'#ea580c'});
shape('text',{x:X-17,y:mid+4,fill:'#ea580c','font-size':10,'text-anchor':'end'},svg,fmt(r.h));
shape('line',{x1:X,y1:Y+H+(mode==='B'?32:20),x2:X+W,y2:Y+H+(mode==='B'?32:20),stroke:'#ea580c'});
shape('line',{x1:X,y1:Y+H+(mode==='B'?27:15),x2:X,y2:Y+H+(mode==='B'?37:25),stroke:'#ea580c'});
shape('line',{x1:X+W,y1:Y+H+(mode==='B'?27:15),x2:X+W,y2:Y+H+(mode==='B'?37:25),stroke:'#ea580c'});
shape('text',{x:210,y:Y+H+(mode==='B'?54:42),fill:'#ea580c','font-size':12,'font-weight':700,'text-anchor':'middle'},svg,`부재 가로 ${fmt(r.m)} mm`);
}
function detail(label,value,color){return `<div class="detail"><span>${label}</span><strong style="color:${color}">${fmt(value)} mm</strong></div>`;}
function render(){
const endsSelected=mode==='B'||mode==='A'&&checked('a-ends');
const edge=endsSelected?val(mode==='A'?'a-edge':'b-edge'):0;
const ends=endsSelected&&Number.isFinite(edge)&&edge>0;
for(const t of ['A','B','C']){document.querySelector(`[data-mode="${t}"]`).setAttribute('aria-selected',String(mode===t));$(t.toLowerCase()+'-panel').classList.toggle('hidden',mode!==t);}
$('type-title').textContent=mode==='A'?'A형 · 균등 분할':mode==='B'?'B형 · 좌우 촉 구분':'C형 · 촉 고정 / 간격 자동';
$('a-edge-wrap').classList.toggle('hidden',!checked('a-ends'));
$('edge-slope').disabled=!ends;
$('edge-slope-wrap').classList.toggle('unavailable',!ends);
$('edge-slope-wrap').title=ends?'':'좌/우 촉이 없는 유형에서는 적용되지 않습니다.';
$('drawing-status').textContent=`${mode}형 · ${checked('reverse')?'반전':'기본'} 방향`;
document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===view)));
const r=compute();if(r.error){$('result').innerHTML=`<div class="error">${r.error}</div>`;$('drawing').replaceChildren();return;}
let html=`<div class="metrics"><div class="metric"><small>대각선 총길이</small><strong>${fmt(r.total)} mm</strong></div><div class="metric"><small>${mode==='C'?'대각선 촉 길이':'대각선 균등 분할'}</small><strong>${fmt(mode==='C'?r.tooth:r.step)} mm</strong></div></div>`;
if(endsSelected){html+=detail('좌우 촉 가로 길이 (각각)',r.edge,'#16a34a');}
if(mode==='B'){html+=detail('중앙 가로 길이 (좌우 촉 제외)',r.m-2*r.edge,'#ea580c');}
if(mode==='C'){html+=detail('가로 촉 사이 간격 (자동)',(r.m-r.n*val('ct'))/(r.n-1),'#dc2626');html+=detail('대각선 촉 사이 간격',r.gap,'#2563eb');html+=detail('남는 여백',0,'#ea580c');}
$('result').innerHTML=html;draw(r);
}
document.querySelectorAll('input').forEach(el=>{el.addEventListener('input',render);el.addEventListener('change',render)});
document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.mode;render()}));
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{view=b.dataset.view;render()}));
$('reset').addEventListener('click',()=>{for(const [id,v] of Object.entries(defaults)){const el=$(id);if(el.type==='checkbox')el.checked=v;else el.value=v;}mode='A';view='each';render();});
render();
})();
</script>
</body>
</html>
